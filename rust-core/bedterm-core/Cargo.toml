[package]
name = "bedterm-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bedterm_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "bedterm-render"
path = "src/bin/bedterm-render/main.rs"

[dependencies]
alacritty_terminal = "0.26"
metal = "0.32"
cosmic-text = "0.12"
swash = "0.1.18"
# PNG decode for embedded agent badge assets. We only need PNG; disable
# default features so the dep stays small (avoids JPEG/GIF/BMP/etc.).
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
core-text = "22.0"
core-graphics = "0.25"
core-foundation = "0.10"
