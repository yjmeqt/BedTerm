[package]
name = "bedterm-ios-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bedterm_ios_ui"
crate-type = ["staticlib", "rlib"]

# iOS-only crate. On non-iOS targets the library compiles to an empty stub
# via `#![cfg(target_os = "ios")]` at the top of `lib.rs`; we still need the
# objc2 dependencies guarded so they only resolve under the iOS target.
[target.'cfg(target_os = "ios")'.dependencies]
# `disable-encoding-assertions` is the upstream-blessed escape hatch for
# `UITextInputTraits` protocol-property setters that the runtime sees as
# missing during debug-time `class_getInstanceMethod` verification (see
# https://github.com/madsmtm/objc2/issues/645). It replaces the
# `raw_set_i64` workaround previously living in `input_bar.rs`.
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSNotification",
    "NSValue",
    "NSArray",
    "NSDictionary",
    "NSRange",
] }
objc2-ui-kit = { version = "0.3", features = [
    "UIResponder",
    "UIViewController",
    "UIView",
    "UILabel",
    "UINavigationItem",
    "UIBarItem",
    "UIBarButtonItem",
    "UIImage",
    "UIImageConfiguration",
    "UIImageSymbolConfiguration",
    "UIButton",
    "UIButtonConfiguration",
    "UIBackgroundConfiguration",
    "UIStackView",
    "UIGeometry",
    "UIFontDescriptor",
    "UINavigationController",
    "UIColor",
    "UIFont",
    "UIControl",
    "UIScrollView",
    "UITextView",
    "UITextField",
    "UITextInput",
    "UITextInputTraits",
    "NSText",
    "UIGestureRecognizer",
    "UITapGestureRecognizer",
    "UIKitDefines",
    "UIEvent",
    "UITouch",
] }
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLTexture",
    "MTLPixelFormat",
    "MTLDefines",
] }
objc2-metal-kit = { version = "0.3", features = [
    "MTKView",
    "MTKDefines",
] }
objc2-quartz-core = { version = "0.3", features = [
    "CADisplayLink",
    "CALayer",
] }
