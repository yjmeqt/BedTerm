language = "C"
header = "// Auto-generated by cbindgen. Do not edit by hand."
include_guard = "BEDTERM_CORE_H"
pragma_once = true
cpp_compat = true

[export]
prefix = ""
# Internal externs to CoreText / CoreFoundation that cbindgen would
# otherwise leak into the generated header.
exclude = ["CTFontCreateForString", "CFRange"]

[parse]
parse_deps = false
