[package]
name = "bedterm_core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bedterm_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
alacritty_terminal = "0.26"
metal = "0.32"
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-metal = "0.2"
objc2-metal-kit = "0.2"
objc2-quartz-core = "0.2"
cosmic-text = "0.12"
swash = "0.1.18"
rusqlite = { version = "0.32", default-features = false, features = [] }

[build-dependencies]
cbindgen = "0.27"
