[package]
name = "bedterm-ios"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bedterm_ios"
crate-type = ["staticlib", "rlib"]

# The entire crate is gated on iOS via `#![cfg(target_os = "ios")]` in
# lib.rs. All pure application logic lives in `bedterm-app`. Use
# `cargo check -p bedterm-app` for host-side iteration.
[dependencies]
bedterm-core = { path = "../bedterm-core" }
bedterm-app = { path = "../bedterm-app" }
async-trait = "0.1"
# SSH client (P2+): russh backs the production `SshClient` implementation.
russh = "0.45"
# Base64 decoding for OpenSSH key header inspection in `detect_key_type`.
# Already a transitive dependency of `russh-keys` — listed explicitly here
# so `russh_impl.rs` can import it without depending on an internal re-export.
data-encoding = "2"
# `disable-encoding-assertions` is the upstream-blessed escape hatch for
# `UITextInputTraits` protocol-property setters that the runtime sees as
# missing during debug-time `class_getInstanceMethod` verification (see
# https://github.com/madsmtm/objc2/issues/645). It replaces the
# `raw_set_i64` workaround previously living in `input_bar.rs`.
#
# objc2 / objc2-foundation compile cleanly on macOS hosts (Foundation
# links, UIKit does not), so we keep them unconditional for the pure-
# logic modules that need `Encode` impls + `msg_send!` macro type
# plumbing.
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
# Tokio runtime used by `russh` for async SSH. Features are pulled in
# transitively from `russh` (net, process, rt, sync, macros, etc.).  We
# declare an explicit dep here so code in `russh_impl` can import tokio
# types directly without re-exporting from `russh`.
tokio = "1"
# `block2` is needed (iOS-only target dep below pulls it in for objc2-ui-kit's
# block-taking selectors, e.g. `colorWithDynamicProvider:`). Pulled here as
# the explicit version pin matching what objc2 0.6 transitively requires.
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSNotification",
    "NSValue",
    "NSArray",
    "NSDictionary",
    "NSRange",
    "NSBundle",
    "NSUserDefaults",
] }
# Serde for hosts_store persistence (Keychain blobs, snapshot JSON).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UIKit / Metal frameworks only exist on iOS — gate the bindings on the
# target so host builds don't try to link `-framework UIKit`.
[target.'cfg(target_os = "ios")'.dependencies]
# `security-framework` (+ `-sys` and the `core-foundation` companions) back
# the Rust-owned saved-hosts persistence (`hosts_store`). Cfg-iOS only —
# host unit tests never touch the Keychain.
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2-ui-kit = { version = "0.3", features = [
    "block2",
    "UITraitCollection",
    "UIInterface",
    "UIResponder",
    "UIViewController",
    "UIView",
    "UIWindowScene",
    "UIAction",
    "UIActivityIndicatorView",
    "UIAlertController",
    "UIApplication",
    "UIDocumentPickerViewController",
    "UILabel",
    "UINavigationItem",
    "UIBarItem",
    "UIBarButtonItem",
    "UIImage",
    "UIImageConfiguration",
    "UIImageSymbolConfiguration",
    "UIButton",
    "UIButtonConfiguration",
    "UIBackgroundConfiguration",
    "UIStackView",
    "UIGeometry",
    "UIFontDescriptor",
    "UINavigationController",
    "UIColor",
    "UIFont",
    "UIControl",
    "UISwitch",
    "UIScene",
    "UIScrollView",
    "UITextView",
    "UITextField",
    "UISegmentedControl",
    "UITextInput",
    "UITextInputTraits",
    "NSText",
    "UIGestureRecognizer",
    "UITapGestureRecognizer",
    "UILongPressGestureRecognizer",
    "UIPanGestureRecognizer",
    "UIPress",
    "UIPressesEvent",
    "UIKey",
    "UIKeyConstants",
    "UIKeyCommand",
    "UIKitDefines",
    "UIEvent",
    "UITouch",
    "UIBezierPath",
] }
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLTexture",
    "MTLPixelFormat",
    "MTLDefines",
] }
objc2-metal-kit = { version = "0.3", features = [
    "MTKView",
    "MTKDefines",
] }
objc2-quartz-core = { version = "0.3", features = [
    "CADisplayLink",
    "CALayer",
    "CAShapeLayer",
    "CATransaction",
    "CAMediaTimingFunction",
    "CAAnimation",
    "CAMediaTiming",
] }

# Locale table generation moved to bedterm-app/build.rs.
# cbindgen produces `include/bedterm_ios.h` from this crate + bedterm-app.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cbindgen = "0.27"
