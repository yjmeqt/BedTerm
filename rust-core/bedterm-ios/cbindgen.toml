language = "C"
header = "// Auto-generated by cbindgen. Do not edit by hand."
include_guard = "BEDTERM_IOS_H"
pragma_once = true
cpp_compat = true

[export]
prefix = ""
# Internal externs to CoreText / CoreFoundation that cbindgen would
# otherwise leak into the generated header.
exclude = ["CTFontCreateForString", "CFRange"]
# Force-emit type aliases that aren't directly referenced by any
# `#[no_mangle]` export (the FFI signatures inline the bare-fn type
# instead of using these aliases — see `ffi/vc.rs`). Swift tests refer
# to these typedefs by name, so they must appear in the C header.
include = [
    "BtIosBackCallback",
    "BtIosOnSendCallback",
    "BtIosOnResizeCallback",
]


[parse]
# bedterm-ios depends on bedterm-core (path dep); we want symbols from
# both crates in the same generated header so Swift sees the full ABI
# surface from a single cbindgen run.
parse_deps = true
# Whitelist: only walk into bedterm_core (skip third-party deps like
# alacritty_terminal, metal, cosmic-text, etc. that cbindgen would
# otherwise try to inspect).
include = ["bedterm-core", "bedterm-app"]
# `parse.include` alone limits which deps are parsed for *types*; to
# also emit consts / statics / fns *defined inside that dep* we have to
# list it under `extra_bindings`. Without this, bedterm_core's
# top-level `#[no_mangle] pub extern "C" fn …` items would be silently
# dropped from the header.
extra_bindings = ["bedterm-core", "bedterm-app"]
