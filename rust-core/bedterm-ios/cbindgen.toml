language = "C"
header = "// Auto-generated by cbindgen. Do not edit by hand."
include_guard = "BEDTERM_IOS_H"
pragma_once = true
cpp_compat = true

[export]
prefix = ""
# Only emit functions and typedefs — suppress `pub const` leakage.
item_types = ["functions", "typedefs"]
# Internal externs to CoreText / CoreFoundation that cbindgen would
# otherwise leak into the generated header.
exclude = ["CTFontCreateForString", "CFRange", "CACurrentMediaTime"]
# Force-emit type aliases that aren't directly referenced by any
# `#[no_mangle]` export.
include = [
    "BtIosBackCallback",
    "BtIosOnSendCallback",
    "BtIosOnResizeCallback",
]


[parse]
# Walk bedterm-app for `bt_ios_set_locale` (the only #[no_mangle]
# export outside bedterm-ios). bedterm-core has no FFI exports left
# so it's excluded.
parse_deps = true
include = ["bedterm-app"]
extra_bindings = ["bedterm-app"]
