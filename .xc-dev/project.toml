# .xc-dev/project.toml — generated by `xc-dev :proj init`
schema_version = 1

[project]
path             = "BedTerm.xcworkspace"
scheme           = "BedTerm"
configuration    = "Debug"

[project.configurations.Debug]
bundle_id        = "dev.yjmeqt.bedterm.debug"
product_name     = "BedTerm Debug"

[project.configurations.Release]
bundle_id        = "dev.yjmeqt.bedterm"
product_name     = "BedTerm"

[vars]
# Mint-managed xcbeautify (see Mintfile). Tasks pipe xcodebuild through this.
xcbeautify = "mint run xcbeautify -q"
