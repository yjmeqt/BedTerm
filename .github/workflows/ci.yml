name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$XCODE"
      - name: Install Mint
        run: brew install mint
      - name: Cache Mint
        uses: actions/cache@v5
        with:
          path: ~/.mint
          key: mint-${{ runner.os }}-${{ hashFiles('Mintfile') }}
          restore-keys: mint-${{ runner.os }}-
      - name: Bootstrap tools
        run: mint bootstrap
      - name: swift-format lint
        run: xcrun swift-format lint -r --strict BedTerm BedTermKit/Sources BedTermKit/Tests
      - name: SwiftLint
        run: mint run swiftlint lint --strict

  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        # macos-latest runner ships multiple Xcode versions; pick the latest 26.x present,
        # falling back to whatever Xcode is available if 26.x is not yet on the image.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install Mint
        run: brew install mint
      - name: Cache Mint
        uses: actions/cache@v5
        with:
          path: ~/.mint
          key: mint-${{ runner.os }}-${{ hashFiles('Mintfile') }}
          restore-keys: mint-${{ runner.os }}-
      - name: Bootstrap tools
        run: mint bootstrap
      - name: Install Metal toolchain (best effort)
        # Older Xcode required this; Xcode 26 usually has it preinstalled. Apple's
        # asset CDN occasionally 500s on the catalog request — tolerate failure so a
        # flaky download doesn't block CI. If Metal is genuinely missing, the build
        # step below will fail loudly with the actual error.
        run: sudo xcodebuild -downloadComponent MetalToolchain || true
      - name: Install Rust toolchain & targets
        # The BedTerm.app scheme has a pre-action that runs
        # scripts/build-rust-xcframework.sh, which receives PLATFORM_NAME from
        # Xcode and builds ONLY the matching slice. CI tests against
        # `platform=iOS Simulator` (PLATFORM_NAME=iphonesimulator), so the
        # device + macOS targets are never used here. rust-toolchain.toml pins
        # the channel; `rustup show` materializes it.
        run: |
          rustup show
          rustup target add aarch64-apple-ios-sim
      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          # Bump the `v2` segment to invalidate caches that captured stale build-script
          # stderr (e.g. the rustup SWIFT_DEBUG_INFORMATION_* warnings). The build
          # script's hash is part of the key too so changes to it bust the cache.
          key: cargo-v2-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock', 'rust-core/rust-toolchain.toml', 'scripts/build-rust-xcframework.sh') }}-${{ hashFiles('rust-core/**/*.rs') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock', 'rust-core/rust-toolchain.toml', 'scripts/build-rust-xcframework.sh') }}-
            cargo-v2-${{ runner.os }}-
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build Rust xcframework (sim slice)
        # The Swift package's `.binaryTarget` points at BedTermCore.xcframework;
        # SwiftPM resolution fails if the directory is empty. The scheme's
        # PreAction only fires during `xcodebuild build|test`, not during
        # `-resolvePackageDependencies`, so build the sim slice explicitly
        # here. PLATFORM_NAME=iphonesimulator narrows to the one slice CI tests
        # against; subsequent xcodebuild invocations are a no-op via the
        # script's digest-based idempotency check.
        run: scripts/build-rust-xcframework.sh Debug iphonesimulator
      - name: Resolve SwiftPM packages
        run: xcodebuild -resolvePackageDependencies -workspace BedTerm.xcworkspace -scheme BedTerm
      - name: Build & test
        # Strategy A: name-only destination (no OS=) so xcodebuild picks the latest
        # matching iOS Simulator runtime available on the runner image.
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace BedTerm.xcworkspace \
            -scheme BedTerm \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -skipPackagePluginValidation \
            | mint run xcbeautify
