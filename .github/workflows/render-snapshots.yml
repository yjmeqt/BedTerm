name: render-snapshots
on:
  pull_request:
    paths:
      - 'rust-core/bedterm-core/src/renderer/**'
      - 'rust-core/bedterm-core/src/bin/bedterm-render/**'
      - 'rust-core/bedterm-core/src/device_presets.rs'
      - 'BedTermKit/Sources/BedTermKit/**'
      - 'BedTermKit/Tests/BedTermKitTests/**'
      - 'scripts/sgr-test/**'
      - 'scripts/ci/render-snapshots.sh'
      - '.github/workflows/render-snapshots.yml'
  push:
    branches: [main]

jobs:
  render:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5

      # ── Rust ────────────────────────────────────────────────────
      - name: Install Rust toolchain
        working-directory: rust-core
        run: |
          rustup show
          rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build bedterm-render
        working-directory: rust-core
        run: cargo build --bin bedterm-render

      # ── macOS renders ───────────────────────────────────────────
      - name: macOS renders
        run: bash scripts/ci/render-snapshots.sh --macos

      - name: Upload macOS renders
        uses: actions/upload-artifact@v5
        with:
          name: renders-macos
          path: /tmp/ci-renders/macos/
          retention-days: 7

      # ── iOS Simulator renders ───────────────────────────────────
      # Disabled: GHA macos-15 runner has Xcode 16.x; Package.swift
      # requires Swift 6.2 (Xcode 26+). Re-enable when GHA ships a
      # macOS runner with Xcode 26.
      - name: iOS renders
        if: false
        env:
          RENDER_OUTPUT_DIR: /tmp/ci-renders/ios
        run: |
          xcodebuild test \
            -scheme BedTerm \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -only-testing "BedTermKitTests/TerminalRendererSnapshotTests" \
            2>&1 | tail -30

      - name: Upload iOS renders
        if: false
        uses: actions/upload-artifact@v5
        with:
          name: renders-ios
          path: /tmp/ci-renders/ios/
          retention-days: 7
