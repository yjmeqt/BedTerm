[package]
name = "terminal_emu"
version = "0.1.0"
edition = "2024"
description = "Warp-style terminal emulator core for iOS, wrapping alacritty_terminal"

[lib]
crate-type = ["staticlib"]

[dependencies]
alacritty_terminal = "0.24"
unicode-width = "0.2"
log = "0.4"

[profile.release]
lto = true
opt-level = "s"
strip = true
